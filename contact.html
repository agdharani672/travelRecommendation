<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Travel Bloom</title>
   <link rel="stylesheet" href="./travel_recommendation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
   <header class="header-content">
            <div class="header-logo-section">
                <img src="./assets/aeroplane_logo-removebg-preview.png" class="header-logo">
                <span class="header-title">Travel Bloom</span>
            </div>
           <nav class="nav-container">
    <a href="travel_recommendation.html" class="nav-link">HOME</a>
    <a href="about.html" class="nav-link">ABOUT</a>
    <a href="contact.html" class="nav-link">CONTACT US</a>
</nav>

        </header>

    <!-- ===== ABOUT SECTION + TEAM SECTION (same background) ===== -->
  <div class="main-content">

    <!-- left-side social icons -->
    <div class="social-icons">
        <a href="https://twitter.com" class="social-icon"><i class="fab fa-twitter"></i></a>
        <a href="https://instagram.com" class="social-icon"><i class="fab fa-instagram"></i></a>
        <a href="https://facebook.com" class="social-icon"><i class="fab fa-facebook-f"></i></a>
        <a href="https://youtube.com" class="social-icon"><i class="fab fa-youtube"></i></a>
    </div>

    <!-- PAGE CONTENT -->
    <div class="home-text-container" style="width:100%; margin-left:4rem; gap:3rem; flex-direction:row; align-items:center;">

        <!-- LEFT SIDE - Title -->
        <div style="width:50%;">
            <h1 class="home-title" style="font-size:3.2rem;">CONTACT&nbsp;US</h1>
            <p style="font-size:1.1rem; color:white; text-shadow:2px 2px 8px rgba(0,0,0,0.85); margin-top:1rem;">
                Get in touch
            </p>
        </div>

        <!-- RIGHT SIDE - Contact Form -->
        <form style="
            width:40%;
            display:flex;
            flex-direction:column;
            gap:1rem;
            background:rgba(0,0,0,0.15);
            padding:1.5rem;
            border-radius:1rem;
            backdrop-filter:blur(4px);
            z-index:2;
        ">

            <label style="color:white;">Name</label>
            <input type="text" required style="padding:0.7rem;   background:rgba(0,0,0,0.1);
            border-radius:0.5rem;
            backdrop-filter:blur(4px); border:none; outline:none;" placeholder="Enter name">

            <label style="color:white;">Email</label>
            <input type="email" required placeholder="Enter email"
            style="padding:0.7rem;   background:rgba(0,0,0,0.1);
            border-radius:0.5rem;
            backdrop-filter:blur(4px); border:none; outline:none;">

            <label style="color:white;">Message</label>
            <textarea rows="4" required  placeholder="Type a message.."
           style="padding:0.7rem;   background:rgba(0,0,0,0.1);
            border-radius:0.5rem;
            backdrop-filter:blur(4px); border:none; outline:none;"></textarea>

            <button class="home-button" style="width:100%; font-size:1rem; margin-top:0.5rem;">
                Submit
            </button>
        </form>

    </div>
</div>


</body>
</html>
